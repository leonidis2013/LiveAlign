name: Build LiveAlign

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Linux checks (tests, screenshot run, pluginval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Measurement engine tests (with address and undefined-behaviour sanitizers)
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -Wall -Wextra -ISource Tests/AnalysisTests.cpp -o analysis_tests
          ./analysis_tests

      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache xvfb libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libxss-dev libxkbcommon-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev fonts-dejavu-core

      # JUCE and the compiled objects are kept between runs: an unchanged file is not compiled again
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps
            ~/.cache/ccache
          key: linux-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            linux-${{ hashFiles('CMakeLists.txt') }}-
            linux-

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLA_BUILD_TESTS=ON -DLA_BUILD_PREVIEW=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the tests, the screenshot tool and the VST3
        run: |
          set -o pipefail
          cmake --build build --target AppTests LiveAlignPreview LiveAlign_VST3 --parallel 2>&1 | tee build.log
          ccache -s || true

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:|fatal error" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done

      - name: Tuning logic tests
        run: ./build/AppTests_artefacts/Release/AppTests

      # The whole tuning flow on a simulated PA and room: every page, the reports, and pass / fail checks along the
      # way (it fails the build when one fails). Text that does not fit is listed.
      - name: Screenshot run with checks
        run: |
          set -o pipefail
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1920x1200x24" ./build/LiveAlignPreview shots 2>&1 | tee shots/preview.log
          grep -E "^(CHECK|OVERFLOW|RESULT)" shots/preview.log | sed -e 's/^CHECK FAIL/::error::CHECK FAIL/' -e 's/^OVERFLOW/::warning::OVERFLOW/' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LiveAlign-screenshots
          path: |
            shots/*.png
            shots/*.pdf
            shots/preview.log

      - name: pluginval (the VST3 in a test host)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -o -q pluginval.zip
          VST3=$(find build -type d -name "LiveAlign.vst3" | head -n 1)
          echo "VST3: $VST3"
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 600000 --validate "$VST3"

  build:
    name: App + VST3 (${{ matrix.name }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # JUCE, fetched (and its build tools built) once and kept between runs
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Configure (macOS, universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --target LiveAlign_VST3 LiveAlign_Standalone --parallel 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "error [A-Z]+[0-9]+|error:|fatal error|LNK[0-9]+" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Locate the builds
        id: locate
        shell: bash
        run: |
          # the VST3 is a bundle folder on both platforms (the Windows DLL inside it has the same name)
          VST3=$(find build -maxdepth 6 -type d -name "LiveAlign.vst3" | head -n 1)
          echo "::notice::vst3 candidates: $(find build -maxdepth 8 -name 'LiveAlign.vst3' -printf '%p (%s bytes, %y) ' 2>/dev/null || find build -maxdepth 8 -name 'LiveAlign.vst3' | tr '\n' ' ')"
          echo "::notice::vst3 picked: $VST3 ($(du -sk "$VST3" 2>/dev/null | cut -f1) KB)"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            APP=$(find build -maxdepth 6 -name "LiveAlign.app" | head -n 1)
          else
            APP=$(find build -maxdepth 6 -path "*Standalone*" -name "LiveAlign.exe" | head -n 1)
          fi
          echo "VST3: $VST3"
          echo "App:  $APP"
          echo "vst3=$VST3" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "${{ steps.locate.outputs.vst3 }}"
          codesign --force --deep --sign - "${{ steps.locate.outputs.app }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # 7-Zip keeps the LiveAlign.vst3 bundle folder as the archive's root (Compress-Archive wrote an empty zip for it)
          7z a -tzip LiveAlign-Windows-VST3.zip "${{ steps.locate.outputs.vst3 }}" > /dev/null
          7z a -tzip LiveAlign-Windows-App.zip "${{ steps.locate.outputs.app }}" > /dev/null

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent "${{ steps.locate.outputs.vst3 }}" LiveAlign-macOS-VST3.zip
          ditto -c -k --keepParent "${{ steps.locate.outputs.app }}" LiveAlign-macOS-App.zip

      - name: Check the packages
        shell: bash
        run: |
          # a package that is only a few bytes is an empty archive: fail here rather than publish it
          for z in LiveAlign-*.zip; do
            size=$(wc -c < "$z")
            echo "$z: $size bytes"
            if [[ "$size" -lt 500000 ]]; then echo "::error::$z is too small to be a build ($(unzip -l "$z" | tail -n 8 | tr '\n' ' '))"; exit 1; fi
          done
          unzip -l LiveAlign-*-VST3.zip | tail -n 12

      - uses: actions/upload-artifact@v4
        with:
          name: LiveAlign-${{ matrix.name }}
          path: LiveAlign-*.zip

  release:
    name: Publish downloads
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Every push to main publishes (or refreshes) the release for the version in CMakeLists.txt,
      # as a normal release marked "Latest", so it shows on the repository page.
      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          VERSION=$(sed -n 's/^project(LiveAlign VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          TAG="v${VERSION}"
          # what's new: the commit message's bullet lines (shown by the app's update check), then the build note
          CHANGES=$(git log -1 --pretty=%B "$GITHUB_SHA" | awk '/^- /{if(b)print b; b=$0; next} /^  +[^ ]/{if(b){sub(/^ +/,""); b=b" "$0}; next} {if(b)print b; b=""} END{if(b)print b}')
          BUILD="LiveAlign ${VERSION}, built from ${GITHUB_SHA::7}. Windows x64 and macOS universal (Apple silicon + Intel): the standalone app and the VST3, zipped. See the README for installing."
          NOTES=$(printf '%s\n\n%s' "$CHANGES" "$BUILD")
          # remove the old rolling pre-release from earlier versions
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "LiveAlign ${VERSION}" --notes "$NOTES" --latest
